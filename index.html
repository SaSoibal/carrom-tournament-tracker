<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrom Tournament Tracker</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #e67e22;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
            --border-color: #dddddd;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --primary-color: #f39c12;
            --accent-color: #2ecc71;
            --danger-color: #e74c3c;
            --border-color: #333333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
        }

        header {
            background-color: var(--card-bg);
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1, h2, h3 {
            margin: 0;
        }

        h1 { font-size: 1.25rem; font-weight: bold; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; }

        .btn-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .main-content {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 80px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active { opacity: 0.8; }
        .btn-primary { background-color: var(--primary-color); color: #fff; }
        .btn-accent { background-color: var(--accent-color); color: #fff; }
        .btn-danger { background-color: var(--danger-color); color: #fff; }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-color); }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .team-row:last-child { border-bottom: none; }

        .badge {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Spinner Styles */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
        }

        .wheel-outer {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--text-color);
            position: relative;
            overflow: hidden;
            transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
            box-shadow: var(--shadow);
        }

        .pointer {
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid var(--danger-color);
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .spinner-result {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
            min-height: 24px;
            text-align: center;
        }

        /* Tabs */
        .nav-tabs {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-color);
            opacity: 0.6;
            cursor: pointer;
            border-top: 3px solid transparent;
        }

        .tab-item.active {
            opacity: 1;
            color: var(--primary-color);
            border-top: 3px solid var(--primary-color);
        }

        .hidden { display: none !important; }

        .score-input-container {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 12px;
        }

        .celebration {
            text-align: center;
            padding: 32px 16px;
        }
        .celebration h2 {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1 id="app-title">Carrom Tracker</h1>
        <button class="btn-toggle" onclick="toggleDarkMode()">🌓 Mode</button>
    </header>

    <div class="main-content">
        <!-- SCREEN 1: SETUP -->
        <div id="screen-setup" class="card">
            <h2>Dynamic Team Setup</h2>
            <div class="input-group">
                <label>Team Name (e.g., Player 1)</label>
                <input type="text" id="setup-team-name" placeholder="Enter team name">
            </div>
            <div class="input-group">
                <label>Player 1 Name</label>
                <input type="text" id="setup-p1" placeholder="First player">
            </div>
            <div class="input-group">
                <label>Player 2 Name</label>
                <input type="text" id="setup-p2" placeholder="Second player">
            </div>
            <button class="btn btn-secondary" onclick="addTeam()" style="margin-bottom: 16px;">+ Add Team</button>

            <h3>Added Teams (<span id="team-count">0</span>)</h3>
            <div id="setup-teams-list" style="margin-bottom: 16px; min-height: 50px;"></div>

            <button class="btn btn-primary" onclick="startTournament()">Start Tournament</button>
        </div>

        <!-- SCREEN 2: MAIN BOARD -->
        <div id="screen-board" class="hidden">
            <!-- Champion Banner -->
            <div id="champion-banner" class="card celebration hidden" style="margin-bottom: 16px; border: 3px solid var(--primary-color);">
                <h2>🏆 CHAMPION! 🏆</h2>
                <h3 id="champion-name" style="margin-bottom: 16px;">Team Name</h3>
                <button class="btn btn-primary" onclick="resetTournament()">Start New Tournament</button>
            </div>

            <!-- Active Match -->
            <div class="card" id="active-match-card">
                <h2>🎴 Current Match (Target: 50)</h2>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div>
                        <strong id="board-t1-name">Team 1</strong>
                        <div style="font-size: 0.85rem; opacity: 0.7;" id="board-t1-players">P1, P2</div>
                        <div style="font-size: 1.2rem; font-weight: bold; margin-top: 4px;">Total: <span id="board-t1-total">0</span>/50</div>
                    </div>
                    <div style="font-size: 1.5rem; font-weight: bold; color: var(--primary-color);">VS</div>
                    <div style="text-align: right;">
                        <strong id="board-t2-name">Team 2</strong>
                        <div style="font-size: 0.85rem; opacity: 0.7;" id="board-t2-players">P3, P4</div>
                        <div style="font-size: 1.2rem; font-weight: bold; margin-top: 4px;">Total: <span id="board-t2-total">0</span>/50</div>
                    </div>
                </div>

                <!-- Toss Spinner Area -->
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 12px;">
                    <label style="text-align: center;">🎯 Toss / Break Decision Spinner</label>
                    <div class="spinner-container">
                        <div style="position: relative;">
                            <div class="pointer"></div>
                            <div class="wheel-outer" id="wheel"></div>
                        </div>
                        <button class="btn btn-secondary" id="btn-spin" onclick="spinWheel()" style="width: auto; padding: 6px 16px;">Spin Toss</button>
                        <div class="spinner-result" id="spinner-res"></div>
                    </div>
                </div>

                <!-- Score Submission -->
                <div style="border-top: 1px solid var(--border-color); padding-top: 12px;">
                    <label>Submit Match Score (Max 14 per match)</label>
                    <div class="score-input-container">
                        <div style="flex: 1;">
                            <input type="number" id="score-t1" min="0" max="14" placeholder="T1 Score">
                        </div>
                        <div>-</div>
                        <div style="flex: 1;">
                            <input type="number" id="score-t2" min="0" max="14" placeholder="T2 Score">
                        </div>
                    </div>
                    <button class="btn btn-accent" onclick="submitMatchScore()" style="margin-top: 12px;">Submit & Rotate</button>
                </div>
            </div>

            <!-- Queue Status -->
            <div class="card" style="margin-top: 16px;" id="queue-card">
                <h2>⏳ Waiting Queue (Next Up)</h2>
                <div id="queue-list"></div>
            </div>
        </div>

        <!-- SCREEN 3: HISTORY & STANDINGS -->
        <div id="screen-history" class="hidden">
            <div class="card">
                <h2>📊 Live Standings</h2>
                <div id="standings-list"></div>
            </div>
            <div class="card" style="margin-top: 16px;">
                <h2>📜 Match History Logs</h2>
                <div id="history-log-list"></div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Tabs (Only visible when game starts) -->
    <div class="nav-tabs hidden" id="app-nav">
        <div class="tab-item active" id="tab-game" onclick="switchTab('game')">🎮 Match</div>
        <div class="tab-item" id="tab-stats" onclick="switchTab('stats')">📊 Stats & Logs</div>
    </div>
</div>

<script>
    let teams = [];
    let queue = [];
    let currentMatch = { t1: null, t2: null };
    let historyLogs = [];
    let isTournamentActive = false;
    let currentRotationPlayers = [];

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
    }

    function addTeam() {
        const teamNameInput = document.getElementById('setup-team-name');
        const p1Input = document.getElementById('setup-p1');
        const p2Input = document.getElementById('setup-p2');

        const name = teamNameInput.value.trim();
        const p1 = p1Input.value.trim();
        const p2 = p2Input.value.trim();

        if (!name || !p1 || !p2) {
            alert('Please fill out Team Name and both Player Names.');
            return;
        }

        const newTeam = {
            id: 'team_' + Date.now() + Math.random().toString(36).substr(2, 4),
            name: name,
            p1: p1,
            p2: p2,
            totalPoints: 0
        };

        teams.push(newTeam);
        
        // Reset inputs
        teamNameInput.value = '';
        p1Input.value = '';
        p2Input.value = '';

        updateSetupList();
    }

    function updateSetupList() {
        const listDiv = document.getElementById('setup-teams-list');
        document.getElementById('team-count').innerText = teams.length;
        listDiv.innerHTML = '';

        teams.forEach((t, index) => {
            const row = document.createElement('div');
            row.className = 'team-row';
            row.innerHTML = `
                <div>
                    <strong>${t.name}</strong> <span style="font-size:0.8rem; opacity:0.7;">(${t.p1}, ${t.p2})</span>
                </div>
                <button class="btn btn-danger" style="width:auto; padding:4px 8px; font-size:0.8rem;" onclick="removeTeam(${index})">Remove</button>
            `;
            listDiv.appendChild(row);
        });
    }

    function removeTeam(index) {
        teams.splice(index, 1);
        updateSetupList();
    }

    function startTournament() {
        if (teams.length < 2) {
            alert('You need at least 2 teams to start the tournament.');
            return;
        }

        isTournamentActive = true;
        // Deep copy teams into the queue order
        queue = [...teams];
        
        // Set up first match
        currentMatch.t1 = queue.shift();
        currentMatch.t2 = queue.shift();

        // Switch screens
        document.getElementById('screen-setup').classList.add('hidden');
        document.getElementById('screen-board').classList.remove('hidden');
        document.getElementById('app-nav').classList.remove('hidden');

        refreshBoard();
        updateStandingsAndLogs();
    }

    function refreshBoard() {
        if (!currentMatch.t1 || !currentMatch.t2) return;

        document.getElementById('board-t1-name').innerText = currentMatch.t1.name;
        document.getElementById('board-t1-players').innerText = `${currentMatch.t1.p1} & ${currentMatch.t1.p2}`;
        document.getElementById('board-t1-total').innerText = currentMatch.t1.totalPoints;

        document.getElementById('board-t2-name').innerText = currentMatch.t2.name;
        document.getElementById('board-t2-players').innerText = `${currentMatch.t2.p1} & ${currentMatch.t2.p2}`;
        document.getElementById('board-t2-total').innerText = currentMatch.t2.totalPoints;

        // Clear spinner
        document.getElementById('spinner-res').innerText = '';
        
        // Load playing players onto the spinner options
        currentRotationPlayers = [
            currentMatch.t1.p1, currentMatch.t1.p1, // doubling slice visualization count naturally
            currentMatch.t1.p2, currentMatch.t1.p2,
            currentMatch.t2.p1, currentMatch.t2.p1,
            currentMatch.t2.p2, currentMatch.t2.p2
        ];
        buildWheelUI();

        // Refresh Queue List UI
        const queueList = document.getElementById('queue-list');
        queueList.innerHTML = '';
        if (queue.length === 0) {
            queueList.innerHTML = '<div style="opacity:0.6; text-align:center; padding:8px;">No other teams waiting. Winner keeps board, loser returns here.</div>';
        } else {
            queue.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'team-row';
                item.innerHTML = `
                    <div><strong>#${i+1} Next: ${t.name}</strong></div>
                    <div><span class="badge">Points: ${t.totalPoints}</span></div>
                `;
                queueList.appendChild(item);
            });
        }
    }

    function buildWheelUI() {
        const wheel = document.getElementById('wheel');
        wheel.innerHTML = '';
        // Create 4 distinct slices for the active players
        const uniquePlayers = [currentMatch.t1.p1, currentMatch.t1.p2, currentMatch.t2.p1, currentMatch.t2.p2];
        const colors = ['#e67e22', '#3498db', '#2ecc71', '#9b59b6'];
        
        uniquePlayers.forEach((player, i) => {
            const slice = document.createElement('div');
            slice.style.position = 'absolute';
            slice.style.width = '100%';
            slice.style.height = '100%';
            slice.style.background = colors[i];
            slice.style.transform = `rotate(${i * 90}deg)`;
            slice.style.clipPath = 'polygon(50% 50%, 50% 0%, 100% 0%, 100% 50%)';
            
            const textLabel = document.createElement('div');
            textLabel.innerText = player;
            textLabel.style.position = 'absolute';
            textLabel.style.top = '25px';
            textLabel.style.left = '95px';
            textLabel.style.transform = 'rotate(45deg)';
            textLabel.style.color = '#fff';
            textLabel.style.fontWeight = 'bold';
            textLabel.style.fontSize = '0.75rem';
            
            slice.appendChild(textLabel);
            wheel.appendChild(slice);
        });
    }

    function spinWheel() {
        const uniquePlayers = [currentMatch.t1.p1, currentMatch.t1.p2, currentMatch.t2.p1, currentMatch.t2.p2];
        const randomIndex = Math.floor(Math.random() * uniquePlayers.length);
        const winner = uniquePlayers[randomIndex];
        
        const wheel = document.getElementById('wheel');
        const degrees = 1800 + (randomIndex * -90) - 45; // custom random continuous rotation animation offset
        
        wheel.style.transform = `rotate(${degrees}deg)`;
        document.getElementById('btn-spin').disabled = true;

        setTimeout(() => {
            document.getElementById('spinner-res').innerText = `🎯 Toss Winner: ${winner}!`;
            document.getElementById('btn-spin').disabled = false;
        }, 3000);
    }

    function submitMatchScore() {
        const s1Input = document.getElementById('score-t1');
        const s2Input = document.getElementById('score-t2');
        
        const s1 = parseInt(s1Input.value);
        const s2 = parseInt(s2Input.value);

        if (isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0) {
            alert('Please enter valid scores for both teams.');
            return;
        }

        if (s1 > 14 || s2 > 14) {
            alert('Single match highest score cap cannot exceed 14 points.');
            return;
        }

        if (s1 === s2) {
            alert('A carrom match cannot end in a draw. One team must win.');
            return;
        }

        // Apply cumulative sum points tracking logic
        currentMatch.t1.totalPoints += s1;
        currentMatch.t2.totalPoints += s2;

        let winner = s1 > s2 ? currentMatch.t1 : currentMatch.t2;
        let loser = s1 > s2 ? currentMatch.t2 : currentMatch.t1;
        let winScore = s1 > s2 ? s1 : s2;
        let loseScore = s1 > s2 ? s2 : s1;

        // Log history data format payload
        historyLogs.unshift({
            winner: winner.name,
            loser: loser.name,
            pointsDiff: (winScore - loseScore),
            scoreStr: `${winScore} - ${loseScore}`
        });

        // Check overall grand milestone 50 point criteria target rule limit
        if (winner.totalPoints >= 50) {
            declareChampion(winner);
            return;
        }

        // Queue Rotation Mechanics
        // Winner retains the board. Loser returns to the back of queue line
        queue.push(loser);
        
        // Next waiting team comes onto the board
        if (s1 > s2) {
            currentMatch.t2 = queue.shift();
        } else {
            currentMatch.t1 = queue.shift();
        }

        // Reset text score fields
        s1Input.value = '';
        s2Input.value = '';

        refreshBoard();
        updateStandingsAndLogs();
    }

    function declareChampion(team) {
        document.getElementById('champion-name').innerText = `${team.name} (${team.p1} & ${team.p2})`;
        document.getElementById('champion-banner').classList.remove('hidden');
        document.getElementById('active-match-card').classList.add('hidden');
        document.getElementById('queue-card').classList.add('hidden');
        updateStandingsAndLogs();
    }

    function resetTournament() {
        teams = [];
        queue = [];
        currentMatch = { t1: null, t2: null };
        historyLogs = [];
        isTournamentActive = false;

        document.getElementById('champion-banner').classList.add('hidden');
        document.getElementById('active-match-card').classList.remove('hidden');
        document.getElementById('queue-card').classList.remove('hidden');
        
        document.getElementById('screen-board').classList.add('hidden');
        document.getElementById('screen-history').classList.add('hidden');
        document.getElementById('app-nav').classList.add('hidden');
        document.getElementById('screen-setup').classList.remove('hidden');
        
        updateSetupList();
    }

    function updateStandingsAndLogs() {
        // Render Standings
        const standingsList = document.getElementById('standings-list');
        standingsList.innerHTML = '';
        
        // Sort all registered tournament teams by their cumulative run total
        const allTeams = [...teams];
        allTeams.sort((a,b) => b.totalPoints - a.totalPoints);

        allTeams.forEach((t, i) => {
            const row = document.createElement('div');
            row.className = 'team-row';
            row.innerHTML = `
                <div><strong>#${i+1} ${t.name}</strong> <span style="font-size:0.85rem; opacity:0.7;">(${t.p1}/${t.p2})</span></div>
                <div style="font-weight:bold; color:var(--primary-color);">${t.totalPoints} pts</div>
            `;
            standingsList.appendChild(row);
        });

        // Render Logs
        const logList = document.getElementById('history-log-list');
        logList.innerHTML = '';
        if(historyLogs.length === 0) {
            logList.innerHTML = '<div style="opacity:0.6; text-align:center; padding:8px;">No matches completed yet.</div>';
        } else {
            historyLogs.forEach(log => {
                const item = document.createElement('div');
                item.className = 'team-row';
                item.style.fontSize = '0.9rem';
                item.innerHTML = `
                    <div>🎉 <strong>${log.winner}</strong> defeated <strong>${log.loser}</strong></div>
                    <div style="text-align:right; font-size:0.8rem; opacity:0.8;">Diff: +${log.pointsDiff} (${log.scoreStr})</div>
                `;
                logList.appendChild(item);
            });
        }
    }

    function switchTab(tab) {
        document.getElementById('tab-game').classList.remove('active');
        document.getElementById('tab-stats').classList.remove('active');
        
        if (tab === 'game') {
            document.getElementById('tab-game').classList.add('active');
            document.getElementById('screen-board').classList.remove('hidden');
            document.getElementById('screen-history').classList.add('hidden');
        } else {
            document.getElementById('tab-stats').classList.add('active');
            document.getElementById('screen-board').classList.add('hidden');
            document.getElementById('screen-history').classList.remove('hidden');
        }
    }
</script>

</body>
</html>
